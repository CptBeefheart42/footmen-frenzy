# A release: pushing a tag v<version> builds every map with its release name (projects/<map>/project.json `release`)
# and publishes them, zipped, as a release of this repository on the CI's own forge, with the release notes (map
# versions, files, the manifest the next release reads) and the maps' wiki bundles for the league website
# (Footmen_Frenzy_<version>-wiki.zip). Started by hand (workflow_dispatch) it is a dry run: it builds, zips and prints
# the notes, and publishes nothing. Runs in the image of Dockerfile, like check.yml; secrets.BLOB_TOKEN reads the
# binary files and the wiki's stock pack, the job's own token reads the releases and creates the release.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "the version to try, e.g. 7.9.9X-rc1 (a dry run: nothing is published)"
        required: true

jobs:
  release:
    if: vars.REGISTRY != ''
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.REGISTRY }}/${{ vars.REGISTRY_USER }}/footmen-frenzy-check:latest
      credentials:
        username: ${{ vars.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Check
        env:
          FF_BLOB_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/blobs/{sha256}
          FF_BLOB_TOKEN: ${{ secrets.BLOB_TOKEN }}
        run: python3 tools/ff check
      - name: Build the release
        env:
          FF_BLOB_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/blobs/{sha256}
          FF_BLOB_TOKEN: ${{ secrets.BLOB_TOKEN }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          version="${VERSION#v}"
          curl -sSf "$API/releases?limit=50" -H "Authorization: token $TOKEN" -o "$RUNNER_TEMP/releases.json"
          python3 tools/ff release "$version" --releases "$RUNNER_TEMP/releases.json" --tag "v$version"
          cat build/release/notes.md
      - name: Publish
        if: github.event_name == 'push'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        run: python3 .github/scripts/publish_release.py "$API" "$GITHUB_REF_NAME" "$GITHUB_SHA"
