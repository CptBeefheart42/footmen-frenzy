# A release: pushing a tag v<version> builds every map with its release name (projects/<map>/project.json
# release_name) and publishes them, zipped, as a release of this repository on the CI's own forge, with the maps' wiki
# bundles for the league website (Footmen_Frenzy_<version>-wiki.zip). Runs in the image of Dockerfile, like check.yml;
# secrets.BLOB_TOKEN reads the binary files and the wiki's stock pack, the job's own token creates the release.
name: release
on:
  push:
    tags: ["v*"]

jobs:
  release:
    if: vars.REGISTRY != ''
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.REGISTRY }}/${{ vars.REGISTRY_USER }}/footmen-frenzy-check:latest
      credentials:
        username: ${{ vars.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Check
        env:
          FF_BLOB_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/blobs/{sha256}
          FF_BLOB_TOKEN: ${{ secrets.BLOB_TOKEN }}
        run: python3 tools/ff check
      - name: Build the release
        env:
          FF_BLOB_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/blobs/{sha256}
          FF_BLOB_TOKEN: ${{ secrets.BLOB_TOKEN }}
        run: python3 tools/ff release "${GITHUB_REF_NAME#v}"
      - name: Publish
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        run: |
          id=$(python3 -c 'import json,sys; print(json.dumps({"tag_name": sys.argv[1], "name": sys.argv[1]}))' "$GITHUB_REF_NAME" \
            | curl -sSf -X POST "$API/releases" -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' -d @- \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          for zip in build/release/*.zip; do
            curl -sSf -X POST "$API/releases/$id/assets?name=$(basename "$zip")" -H "Authorization: token $TOKEN" \
              -F "attachment=@$zip" > /dev/null
            echo "published $(basename "$zip")"
          done
