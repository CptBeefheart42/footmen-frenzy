# Builds the image ff check runs in (Dockerfile) and pushes it to the CI's own registry, whenever Dockerfile changes
# on main or on demand. check.yml runs in it. The registry and its login come from the CI's settings, never from here:
#   vars.REGISTRY (host), vars.REGISTRY_USER (the namespace and login), secrets.REGISTRY_TOKEN (write:package).
# The runner mounts the host's Docker socket, so `docker build` runs on the host's daemon.
name: image
on:
  push:
    branches: [main]
    paths: [Dockerfile, .github/workflows/image.yml]
  workflow_dispatch:

jobs:
  image:
    if: vars.REGISTRY != ''
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.REGISTRY }}/${{ vars.REGISTRY_USER }}/footmen-frenzy-check:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and push
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | docker login "${{ vars.REGISTRY }}" -u "${{ vars.REGISTRY_USER }}" --password-stdin
          docker build -t "$IMAGE" - < Dockerfile
          docker push "$IMAGE"
